<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Clothing Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 280px;
            padding: 15px;
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
        }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            background-color: #222;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Urban Threads</h1>
        <nav>
            <a href="#men">Men</a>
            <a href="#women">Women</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <div class="container" id="men">
        <!-- Item 1 -->
        <div class="card">
            <a href="https://unsplash.com" target="_blank">
                <img src="https://plus.unsplash.com/premium_photo-1718913936342-eaafff98834b?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"  alt="White T-Shirt">
            </a>
            <h3>Classic White Tee</h3>
            <p>₹799</p>
            <a href="https://plus.unsplash.com/premium_photo-1718913936342-eaafff98834b?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" target="_blank" class="btn">View Full Image</a>
        </div>

        <!-- Item 2 -->
        <div class="card" id="women">
            <a href="https://unsplash.com" target="_blank">
                <img src="https://images.unsplash.com/photo-1727515546577-f7d82a47b51d?q=80&w=736&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Leather Jacket">
            </a>
            <h3>Denim & Leather Jacket</h3>
            <p>₹2,499</p>
            <a href="https://images.unsplash.com/photo-1727515546577-f7d82a47b51d?q=80&w=736&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" target="_blank" class="btn">View Full Image</a>
        </div>

        <!-- Item 3 -->
        <div class="card">
            <a href="https://unsplash.com" target="_blank">
                <img src="https://plus.unsplash.com/premium_photo-1674719144570-0728faf14f96?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Casual Jacket">
            </a>
            <h3>Beige Casual Coat</h3>
            <p>₹1,999</p>
            <a href="https://plus.unsplash.com/premium_photo-1674719144570-0728faf14f96?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" target="_blank" class="btn">View Full Image</a>
        </div>
    </div>

    <footer id="contact">
        <p>Contact us: <a href="mailto:email@gmail.com" style="color: #ddd;">email@gmail.com</a></p>
    </footer>

</body>
</html>
